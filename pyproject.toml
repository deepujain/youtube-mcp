[project]
name = "youtube-mcp"
version = "0.1.1"
description = "YouTube MCP server (streamable HTTP) over YouTube Data API v3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
]

[project.scripts]
youtube-mcp = "youtube_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits the real YouTube Data API; skipped unless credentials are present",
]
